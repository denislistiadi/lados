name: Release Lados

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-tauri:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Cache Downloaded Binaries
        uses: actions/cache@v4
        with:
          path: tmp/bundle_cache
          key: lados-bundle-${{ runner.os }}-v1

      - name: Install Dependencies
        run: npm ci

      - name: Prepare Minimal Bundle Binaries
        run: npm run prepare:bundle

      - name: Build Tauri Application & Upload Assets
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ github.event.release.id }}
          tagName: ${{ github.event.release.tag_name || github.ref_name }}
          releaseName: "Lados ${{ github.event.release.tag_name || github.ref_name }}"
          releaseDraft: false
          prerelease: false
          args: --bundles nsis
